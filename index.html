<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMN¹ | كل الروابط</title>
<meta name="description" content="جميع روابط أيمن في مكان واحد">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root{
    --bg-deep: #140b26;
    --bg-deep-2: #1f1140;
    --violet: #4c1d95;
    --orchid: #9d5cff;
    --orchid-soft: #c9a6ff;
    --gold: #d9b98c;
    --ivory: #f3eefc;
    --muted: #b9aad8;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
    --shadow: 0 8px 30px rgba(20, 8, 50, 0.45);
    --radius: 18px;
    --transition: 0.35s cubic-bezier(.4,0,.2,1);
  }

  [data-theme="light"]{
    --bg-deep: #f4f1fb;
    --bg-deep-2: #e9e2fb;
    --violet: #7c3aed;
    --orchid: #8b5cf6;
    --orchid-soft: #6d28d9;
    --gold: #b8895a;
    --ivory: #1f1533;
    --muted: #6b5c96;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(124, 58, 237, 0.15);
    --shadow: 0 8px 30px rgba(124, 58, 237, 0.12);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    min-height:100%;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg-deep);
    color: var(--ivory);
    transition: background var(--transition), color var(--transition);
    overflow-x:hidden;
  }

  /* خلفية سديمية متحركة */
  .aurora{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .aurora span{
    position:absolute; border-radius:50%; filter: blur(70px); opacity:.55;
    animation: float 18s ease-in-out infinite;
  }
  .aurora span:nth-child(1){ width:420px; height:420px; background: var(--violet); top:-120px; right:-100px; }
  .aurora span:nth-child(2){ width:360px; height:360px; background: var(--orchid); bottom:-140px; left:-100px; animation-delay:-6s; }
  .aurora span:nth-child(3){ width:260px; height:260px; background: var(--gold); top:35%; left:50%; opacity:.18; animation-delay:-11s; }

  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(30px,-25px) scale(1.08); }
  }

  .wrap{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto; padding: 28px 20px 40px;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }

  .topbar{
    width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;
  }

  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background: var(--card-bg); border:1px solid var(--card-border);
    color: var(--ivory); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition: transform var(--transition), background var(--transition);
    backdrop-filter: blur(6px);
  }
  .icon-btn:hover{ transform: translateY(-2px); background: rgba(157,92,255,0.25); }
  .icon-btn:active{ transform: translateY(0); }

  .avatar-frame{
    width:112px; height:112px; border-radius:50%; padding:4px;
    background: linear-gradient(135deg, var(--orchid), var(--gold));
    margin-top:6px; box-shadow: var(--shadow);
  }
  .avatar{
    width:100%; height:100%; border-radius:50%; object-fit:cover;
    background: var(--bg-deep-2);
    display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:38px; color: var(--orchid-soft);
    border: 2px solid var(--bg-deep);
  }

  .name{
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:26px;
    margin-top:16px; letter-spacing:.5px;
  }
  .tagline{
    font-size:14px; color: var(--muted); margin-top:6px; text-align:center; max-width: 320px;
    line-height:1.6;
  }

  .links{
    width:100%; display:flex; flex-direction:column; gap:14px; margin-top:30px;
  }

  .link-btn{
    display:flex; align-items:center; gap:14px;
    background: var(--card-bg); border:1px solid var(--card-border);
    border-radius: var(--radius); padding:16px 18px;
    text-decoration:none; color: var(--ivory);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    backdrop-filter: blur(8px);
    position:relative; overflow:hidden;
  }
  .link-btn::before{
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(157,92,255,0.18), transparent);
    transform: translateX(-100%);
    transition: transform .6s ease;
  }
  .link-btn:hover::before{ transform: translateX(100%); }
  .link-btn:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: var(--orchid);
  }

  .link-icon{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background: linear-gradient(135deg, var(--violet), var(--orchid));
    display:flex; align-items:center; justify-content:center; font-size:19px; color:#fff;
  }
  .link-text{ display:flex; flex-direction:column; gap:2px; }
  .link-title{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:16px; }
  .link-sub{ font-size:12px; color: var(--muted); }
  .link-arrow{ margin-inline-start:auto; color: var(--muted); font-size:14px; }

  .socials{
    display:flex; gap:14px; margin-top:26px;
  }
  .social-btn{
    width:48px; height:48px; border-radius:50%;
    background: var(--card-bg); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ivory); font-size:19px; text-decoration:none;
    transition: transform var(--transition), background var(--transition);
  }
  .social-btn:hover{ transform: translateY(-3px) scale(1.05); background: rgba(157,92,255,0.25); }

  .music-widget{
    display:flex; align-items:center; gap:10px; margin-top:28px;
    background: var(--card-bg); border:1px solid var(--card-border);
    padding:10px 16px; border-radius: 999px; font-size:13px; color: var(--muted);
  }
  .music-btn{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--violet), var(--orchid));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px;
    flex-shrink:0;
  }
  .eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ width:3px; background: var(--orchid); border-radius:2px; animation: eq 1s ease-in-out infinite; }
  .eq span:nth-child(1){ animation-delay:0s; }
  .eq span:nth-child(2){ animation-delay:.2s; }
  .eq span:nth-child(3){ animation-delay:.4s; }
  @keyframes eq{ 0%,100%{ height:4px; } 50%{ height:14px; } }
  .eq.paused span{ animation-play-state: paused; height:4px; }

  footer{
    margin-top:auto; padding-top:34px; text-align:center;
    font-size:12px; color: var(--muted); line-height:1.8;
  }
  footer .brand{ color: var(--orchid-soft); font-weight:600; }

  @media (max-width:360px){
    .name{ font-size:22px; }
    .avatar-frame{ width:96px; height:96px; }
  }
</style>
</head>
<body data-theme="dark">

<div class="aurora"><span></span><span></span><span></span></div>

<div class="wrap">

  <div class="topbar">
    <button class="icon-btn" id="themeToggle" title="تبديل المظهر" aria-label="تبديل المظهر">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <button class="icon-btn" id="musicToggleTop" title="تشغيل / إيقاف الموسيقى" aria-label="تشغيل الموسيقى">
      <i class="fa-solid fa-music" id="musicIconTop"></i>
    </button>
  </div>

  <div class="avatar-frame">
    <!-- استبدل الصورة أدناه بصورتك: profile.jpg بنفس مجلد index.html -->
    <img src="profile.jpg" alt="أيمن" class="avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="avatar" style="display:none;">أ</div>
  </div>

  <h1 class="name">AYMN¹</h1>
  <p class="tagline">مطوّر مواقع ألعاب ومتاجر إلكترونية — كل روابطي في مكان واحد</p>

  <div class="links">
    <a class="link-btn" href="https://aymngames.online/" target="_blank" rel="noopener">
      <div class="link-icon"><i class="fa-solid fa-gamepad"></i></div>
      <div class="link-text">
        <span class="link-title">موقع العاب أيمن</span>
        <span class="link-sub">تصفح أحدث الألعاب</span>
      </div>
      <i class="fa-solid fa-arrow-up-left-from-square link-arrow"></i>
    </a>

    <a class="link-btn" href="https://aymn-games.github.io/my-portfolio/" target="_blank" rel="noopener">
      <div class="link-icon"><i class="fa-solid fa-store"></i></div>
      <div class="link-text">
        <span class="link-title">تصميم وتطوير المتاجر</span>
        <span class="link-sub">خدمات احترافية لمتجرك الإلكتروني</span>
      </div>
      <i class="fa-solid fa-arrow-up-left-from-square link-arrow"></i>
    </a>
  </div>

  <div class="socials">
    <a class="social-btn" href="https://www.tiktok.com/@em70_q" target="_blank" rel="noopener" title="تيك توك" aria-label="تيك توك">
      <i class="fa-brands fa-tiktok"></i>
    </a>
  </div>

  <div class="music-widget">
    <button class="music-btn" id="musicToggle" aria-label="تشغيل الموسيقى">
      <i class="fa-solid fa-play" id="musicIcon"></i>
    </button>
    <span id="musicLabel">موسيقى الخلفية</span>
    <div class="eq paused" id="eq"><span></span><span></span><span></span></div>
  </div>

  <footer>
    <div>© جميع الحقوق محفوظة <span class="brand">لـAYMN¹</span> <span id="year"></span></div>
  </footer>
</div>

<!-- ضع ملف الموسيقى بجانب index.html باسم music.mp3 -->
<audio id="bgMusic" src="music.mp3" preload="none" loop></audio>

<script>
  // السنة في الفوتر
  document.getElementById('year').textContent = new Date().getFullYear();

  // ==== تبديل المظهر الداكن / الفاتح ====
  const body = document.body;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  function applyTheme(theme){
    body.setAttribute('data-theme', theme);
    themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    localStorage.setItem('ayman-theme', theme);
  }
  const savedTheme = localStorage.getItem('ayman-theme') || 'dark';
  applyTheme(savedTheme);

  themeToggle.addEventListener('click', () => {
    const current = body.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // ==== الموسيقى: تشغيل/إيقاف + وقف تلقائي بعد 60 ثانية ثم تكرار ====
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicToggle');
  const musicIcon = document.getElementById('musicIcon');
  const musicIconTop = document.getElementById('musicIconTop');
  const musicLabel = document.getElementById('musicLabel');
  const eq = document.getElementById('eq');
  const MAX_SECONDS = 60;
  let isPlaying = false;

  function setPlayingUI(playing){
    isPlaying = playing;
    musicIcon.className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    musicIconTop.className = playing ? 'fa-solid fa-volume-high' : 'fa-solid fa-music';
    musicLabel.textContent = playing ? 'جارٍ التشغيل' : 'موسيقى الخلفية';
    eq.classList.toggle('paused', !playing);
  }

  function playMusic(){
    audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
  }
  function pauseMusic(){
    audio.pause();
    setPlayingUI(false);
  }
  function toggleMusic(){
    isPlaying ? pauseMusic() : playMusic();
  }

  musicBtn.addEventListener('click', toggleMusic);
  document.getElementById('musicToggleTop').addEventListener('click', toggleMusic);

  audio.addEventListener('timeupdate', () => {
    if (audio.currentTime >= MAX_SECONDS){
      audio.currentTime = 0;
      if (isPlaying) audio.play();
    }
  });

  // محاولة تشغيل تلقائي عند أول تفاعل من الزائر (المتصفحات تمنع autoplay بصوت قبل أي تفاعل)
  function tryAutoplayOnFirstInteraction(){
    playMusic();
    document.removeEventListener('click', tryAutoplayOnFirstInteraction);
    document.removeEventListener('touchstart', tryAutoplayOnFirstInteraction);
  }
  document.addEventListener('click', tryAutoplayOnFirstInteraction, { once:true });
  document.addEventListener('touchstart', tryAutoplayOnFirstInteraction, { once:true });
</script>

</body>
</html>
