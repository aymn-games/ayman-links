<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AYMN¹ </title>
<meta name="description" content="جميع روابط أيمن في مكان واحد">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  :root{
    --bg-deep: #0a0618;
    --bg-deep-2: #150c2e;
    --violet: #4c1d95;
    --orchid: #9d5cff;
    --orchid-soft: #c9a6ff;
    --gold: #e8c48f;
    --rose: #ff8fd6;
    --ivory: #f3eefc;
    --muted: #b3a3d9;
    --card-bg: rgba(255,255,255,0.055);
    --card-border: rgba(255,255,255,0.10);
    --shadow: 0 10px 34px rgba(10, 3, 30, 0.55);
    --transition: 0.35s cubic-bezier(.4,0,.2,1);
  }

  [data-theme="light"]{
    --bg-deep: #f3eefc;
    --bg-deep-2: #e6d9fb;
    --violet: #7c3aed;
    --orchid: #8b5cf6;
    --orchid-soft: #6d28d9;
    --gold: #b8895a;
    --rose: #d946ef;
    --ivory: #1f1533;
    --muted: #6b5c96;
    --card-bg: rgba(255,255,255,0.6);
    --card-border: rgba(124, 58, 237, 0.18);
    --shadow: 0 10px 30px rgba(124, 58, 237, 0.16);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    min-height:100%;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: radial-gradient(ellipse at 50% -10%, var(--bg-deep-2), var(--bg-deep) 60%);
    color: var(--ivory);
    transition: background var(--transition), color var(--transition);
    overflow-x:hidden;
  }

  /* ===== خلفية كونية ===== */
  .cosmos{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }

  .stars-layer{ position:absolute; inset:0; }
  .stars-a{ animation: twinkle 3s ease-in-out infinite; }
  .stars-b{ animation: twinkle 4.5s ease-in-out infinite reverse; opacity:.6; }
  @keyframes twinkle{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .smoke{ position:absolute; border-radius:50%; filter: blur(80px); opacity:.5; mix-blend-mode:screen; }
  [data-theme="light"] .smoke{ mix-blend-mode:multiply; opacity:.28; }
  .smoke.s1{ width:460px; height:460px; background: var(--violet); top:-140px; left:-120px; animation: drift1 22s ease-in-out infinite; }
  .smoke.s2{ width:380px; height:380px; background: var(--rose); bottom:-160px; right:-100px; animation: drift2 26s ease-in-out infinite; }
  .smoke.s3{ width:300px; height:300px; background: var(--orchid); top:40%; left:60%; opacity:.3; animation: drift3 18s ease-in-out infinite; }

  @keyframes drift1{ 0%,100%{ transform: translate(0,0) scale(1); } 33%{ transform: translate(60px,40px) scale(1.15); } 66%{ transform: translate(-20px,70px) scale(.95); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0) scale(1); } 50%{ transform: translate(-70px,-50px) scale(1.2); } }
  @keyframes drift3{ 0%,100%{ transform: translate(-50%,-50%) scale(1); } 50%{ transform: translate(-40%,-60%) scale(1.25); } }

  .planet{ position:absolute; border-radius:50%; }
  .planet.p1{
    width:70px; height:70px; top:12%; left:-10%;
    background: radial-gradient(circle at 32% 30%, #e9d5ff, var(--orchid) 55%, #2c1256 100%);
    box-shadow: 0 0 30px rgba(157,92,255,.5);
    animation: orbit1 34s linear infinite;
  }
  .planet.p1::after{
    content:''; position:absolute; inset:-14px 2px; border:2px solid rgba(233,213,255,.5);
    border-radius:50%; transform: rotate(-18deg) scaleY(.35);
  }
  .planet.p2{
    width:34px; height:34px; bottom:18%; right:-6%;
    background: radial-gradient(circle at 35% 30%, #ffe3b3, var(--gold) 55%, #6b4a25 100%);
    box-shadow: 0 0 22px rgba(232,196,143,.5);
    animation: orbit2 26s ease-in-out infinite;
  }
  @keyframes orbit1{
    0%{ transform: translate(0,0) rotate(0deg); }
    50%{ transform: translate(48vw, 18vh) rotate(180deg); }
    100%{ transform: translate(0,0) rotate(360deg); }
  }
  @keyframes orbit2{
    0%,100%{ transform: translate(0,0); }
    50%{ transform: translate(-38vw, -14vh); }
  }

  .particles{ position:absolute; inset:0; }
  .particle{
    position:absolute; bottom:-10px; border-radius:50%;
    background: var(--orchid-soft); opacity:.7;
    animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.8; }
    90%{ opacity:.5; }
    100%{ transform: translateY(-105vh) translateX(var(--drift,20px)); opacity:0; }
  }

  /* ===== محتوى الصفحة ===== */
  .wrap{
    position:relative; z-index:1;
    max-width:480px; margin:0 auto; padding: 28px 20px 40px;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }

  .topbar{ width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .icon-btn{
    width:42px; height:42px; border-radius:50%;
    background: var(--card-bg); border:1px solid var(--card-border);
    color: var(--ivory); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:16px; transition: transform var(--transition), background var(--transition);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  .icon-btn:hover{ transform: translateY(-2px); background: rgba(157,92,255,0.25); }

  .avatar-frame{
    width:116px; height:116px; border-radius:50%; padding:4px; position:relative;
    background: conic-gradient(from 0deg, var(--orchid), var(--rose), var(--gold), var(--orchid));
    animation: spin 8s linear infinite;
    box-shadow: 0 0 40px rgba(157,92,255,.35);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .avatar-inner{
    width:100%; height:100%; border-radius:50%; overflow:hidden;
    background: var(--bg-deep-2); border:3px solid var(--bg-deep);
    animation: spin-rev 8s linear infinite;
  }
  @keyframes spin-rev{ to{ transform: rotate(-360deg); } }
  .avatar-inner img{ width:100%; height:100%; object-fit:cover; }
  .avatar-fallback{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:40px; color: var(--orchid-soft);
  }

  .name{
    font-family:'Tajawal', sans-serif; font-weight:800; font-size:30px;
    margin-top:20px; letter-spacing:.5px;
    background: linear-gradient(90deg, var(--orchid-soft), var(--gold), var(--rose), var(--orchid-soft));
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5s linear infinite, glow-pulse 2.4s ease-in-out infinite alternate;
  }
  @keyframes shine{ to{ background-position: -300% center; } }
  @keyframes glow-pulse{
    from{ filter: drop-shadow(0 0 6px rgba(157,92,255,.35)); }
    to{ filter: drop-shadow(0 0 20px rgba(157,92,255,.85)); }
  }

  .tagline{ font-size:14px; color: var(--muted); margin-top:8px; text-align:center; max-width:320px; line-height:1.7; }

  /* ===== الأزرار: بطاقات فضائية بشكل غير تقليدي ===== */
  .links{ width:100%; display:flex; flex-direction:column; gap:26px; margin-top:34px; }

  .link-card{
    position:relative; display:flex; align-items:center; gap:18px;
    padding: 18px 22px;
    border-radius: 22px 8px 22px 8px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    text-decoration:none; color: var(--ivory);
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    overflow:hidden;
  }
  .link-card::before{
    content:''; position:absolute; inset-inline-start:0; top:16%; bottom:16%; width:4px;
    border-radius: 6px;
    background: linear-gradient(180deg, var(--orchid), var(--rose));
  }
  .link-card.store::before{ background: linear-gradient(180deg, var(--gold), var(--orchid)); }

  .link-card:hover{ transform: translateY(-4px); box-shadow: var(--shadow); border-color: rgba(157,92,255,.35); }
  .link-card:active{ transform: translateY(-1px); }

  .orb{
    width:58px; height:58px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 20px rgba(157,92,255,.45), inset 0 0 14px rgba(255,255,255,.25);
    animation: bob 3.4s ease-in-out infinite;
    overflow:hidden;
  }
  .orb.orb-games, .orb.orb-store{ background: radial-gradient(circle at 32% 30%, #e9d5ff, var(--orchid) 60%, #2c1256 100%); }
  .orb img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .orb i{ font-size:21px; color:#fff; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
  @keyframes bob{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }

  .link-text{ display:flex; flex-direction:column; gap:3px; }
  .link-title{ font-family:'Tajawal', sans-serif; font-weight:700; font-size:16.5px; }
  .link-sub{ font-size:12px; color: var(--muted); }

  .socials{ display:flex; gap:14px; margin-top:30px; }
  .social-btn{
    width:50px; height:50px; border-radius:50%;
    background: var(--card-bg); border:1px solid var(--card-border);
    display:flex; align-items:center; justify-content:center;
    color: var(--ivory); font-size:20px; text-decoration:none;
    transition: transform var(--transition), background var(--transition), box-shadow var(--transition);
  }
  .social-btn:hover{ transform: translateY(-3px) scale(1.08); }

  /* تيك توك: خلفية سوداء + تأثير الشعار ثلاثي الألوان المميز */
  .social-btn.tiktok{ background:#010101; border-color:#010101; }
  .social-btn.tiktok i{ color:#fff; text-shadow: -2.5px 0 #25F4EE, 2.5px 0 #FE2C55; }
  .social-btn.tiktok:hover{ box-shadow: 0 0 10px rgba(37,244,238,.5), 0 0 22px rgba(254,44,85,.5); }

  /* انستقرام: التدرج اللوني الأصلي */
  .social-btn.instagram{
    background: radial-gradient(circle at 30% 110%, #ffdd55, #ff543e 30%, #c837ab 62%, #7638fa 96%);
    border-color: transparent;
  }
  .social-btn.instagram i{ color:#fff; }
  .social-btn.instagram:hover{ box-shadow: 0 0 24px rgba(200,55,171,.6); }

  /* البريد: نمط تطبيقات الإيميل */
  .social-btn.email{
    background: linear-gradient(135deg, #4f8cff, #2563eb);
    border-color: transparent;
  }
  .social-btn.email i{ color:#fff; }
  .social-btn.email:hover{ box-shadow: 0 0 22px rgba(37,99,235,.55); }

  .music-widget{
    display:flex; align-items:center; gap:10px; margin-top:30px;
    background: var(--card-bg); border:1px solid var(--card-border);
    padding:10px 18px; border-radius: 999px; font-size:13px; color: var(--muted);
  }
  .music-btn{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background: linear-gradient(135deg, var(--violet), var(--orchid));
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
  }
  .eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{ width:3px; background: var(--orchid); border-radius:2px; animation: eqbar 1s ease-in-out infinite; }
  .eq span:nth-child(2){ animation-delay:.2s; }
  .eq span:nth-child(3){ animation-delay:.4s; }
  @keyframes eqbar{ 0%,100%{ height:4px; } 50%{ height:14px; } }
  .eq.paused span{ animation-play-state: paused; height:4px; }

  .visits-widget{
    display:flex; align-items:center; gap:8px; margin-top:18px;
    background: var(--card-bg); border:1px solid var(--card-border);
    padding:9px 18px; border-radius:999px; font-size:13px; color: var(--muted);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .visits-widget i{ color: var(--orchid-soft); font-size:14px; }
  #visitCount{ color: var(--ivory); font-weight:700; font-family:'Tajawal', sans-serif; }

  footer{ margin-top:auto; padding-top:36px; text-align:center; font-size:12px; color: var(--muted); line-height:1.8; }
  footer .brand{ color: var(--orchid-soft); font-weight:600; }

  @media (max-width:360px){
    .name{ font-size:25px; }
    .avatar-frame{ width:98px; height:98px; }
    .link-title{ font-size:15px; }
  }

</style>
</head>
<body data-theme="dark">

<div class="cosmos">
  <svg class="stars-layer stars-a" width="100%" height="100%"></svg>
  <svg class="stars-layer stars-b" width="100%" height="100%"></svg>
  <div class="smoke s1"></div>
  <div class="smoke s2"></div>
  <div class="smoke s3"></div>
  <div class="planet p1"></div>
  <div class="planet p2"></div>
  <div class="particles" id="particles"></div>
</div>

<div class="wrap">

  <div class="topbar">
    <button class="icon-btn" id="themeToggle" title="تبديل المظهر" aria-label="تبديل المظهر">
      <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>
    <button class="icon-btn" id="musicToggleTop" title="تشغيل / إيقاف الموسيقى" aria-label="تشغيل الموسيقى">
      <i class="fa-solid fa-music" id="musicIconTop"></i>
    </button>
  </div>

  <div class="avatar-frame">
    <div class="avatar-inner">
      <!-- استبدل الصورة أدناه بصورتك: profile.jpg بنفس مجلد index.html -->
      <img src="profile.jpg" alt="أيمن" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="avatar-fallback" style="display:none;">أ</div>
    </div>
  </div>

  <h1 class="name">AYMN¹</h1>
  <p class="tagline">مطوّر مواقع ألعاب ومتاجر إلكترونية — كل روابطي في مكان واحد</p>

  <div class="links">
    <a class="link-card" href="https://aymngames.online/" target="_blank" rel="noopener">
      <div class="orb orb-games">
        <!-- ضع صورة icon-games.png (مقاس 200×200 بكسل، مربعة) لعرضها بدل الأيقونة -->
        <img src="icon-games.png" alt="" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none';">
        <i class="fa-solid fa-gamepad"></i>
      </div>
      <div class="link-text">
        <span class="link-title">موقع العاب أيمن</span>
        <span class="link-sub">تصفح أحدث الألعاب</span>
      </div>
    </a>

    <a class="link-card store" href="https://aymn-games.github.io/my-portfolio/" target="_blank" rel="noopener">
      <div class="orb orb-store">
        <!-- ضع صورة icon-store.png (مقاس 200×200 بكسل، مربعة) لعرضها بدل الأيقونة -->
        <img src="icon-store.png" alt="" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';" onerror="this.style.display='none';">
        <i class="fa-solid fa-store"></i>
      </div>
      <div class="link-text">
        <span class="link-title">تصميم وتطوير المتاجر</span>
        <span class="link-sub">خدمات احترافية لمتجرك الإلكتروني</span>
      </div>
    </a>
  </div>

  <div class="socials">
    <a class="social-btn tiktok" href="https://www.tiktok.com/@em70_q" target="_blank" rel="noopener" title="تيك توك" aria-label="تيك توك">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <!-- بدّل الرابط أدناه بحسابك الفعلي في انستقرام -->
    <a class="social-btn instagram" href="https://instagram.com/_xilib" target="_blank" rel="noopener" title="انستقرام" aria-label="انستقرام">
      <i class="fa-brands fa-instagram"></i>
    </a>
    <!-- بدّل البريد أدناه ببريدك الفعلي -->
    <a class="social-btn email" href="https://me.aymngames.online/" title="راسلني عبر الإيميل" aria-label="البريد الإلكتروني">
      <i class="fa-solid fa-envelope"></i>
    </a>
  </div>

  <div class="music-widget">
    <button class="music-btn" id="musicToggle" aria-label="تشغيل الموسيقى">
      <i class="fa-solid fa-play" id="musicIcon"></i>
    </button>
    <span id="musicLabel">موسيقى الخلفية</span>
    <div class="eq paused" id="eq"><span></span><span></span><span></span></div>
  </div>

  <div class="visits-widget">
    <i class="fa-solid fa-eye"></i>
    <span id="visitCount">653</span>
    <span>زائر</span>
  </div>

  <footer>
    <div>© جميع الحقوق محفوظة <span class="brand">لـAYMN¹</span> <span id="year"></span></div>
  </footer>
</div>

<!-- ضع ملف الموسيقى بجانب index.html باسم music.mp3 -->
<audio id="bgMusic" src="music.mp3" preload="none" loop></audio>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // ==== عداد الزوار (يبدأ من 653 ويزيد مع كل زيارة) ====
  (async function counterInit(){
    const ns = 'aymngames-bio', key = 'visits';
    const countEl = document.getElementById('visitCount');
    try{
      await fetch(`https://abacus.jasoncameron.dev/create/${ns}/${key}?initializer=653`);
    }catch(e){}
    try{
      const res = await fetch(`https://abacus.jasoncameron.dev/hit/${ns}/${key}`);
      const data = await res.json();
      if (typeof data.value === 'number'){
        countEl.textContent = data.value.toLocaleString('en-US');
      }
    }catch(e){}
  })();

  // ==== توليد نجوم عشوائية ====
  function buildStars(svgSelector, count, maxR){
    const svg = document.querySelector(svgSelector);
    const w = window.innerWidth, h = window.innerHeight;
    let html = '';
    for(let i=0;i<count;i++){
      const x = Math.random()*w, y = Math.random()*h, r = Math.random()*maxR + 0.4;
      const o = (Math.random()*0.6 + 0.3).toFixed(2);
      html += `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${o}"/>`;
    }
    svg.innerHTML = html;
  }
  buildStars('.stars-a', 70, 1.3);
  buildStars('.stars-b', 45, 1.8);

  // ==== جزيئات متطايرة ====
  const particlesEl = document.getElementById('particles');
  const N_PARTICLES = 22;
  for(let i=0;i<N_PARTICLES;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = (Math.random()*3 + 1.5).toFixed(1);
    const left = (Math.random()*100).toFixed(1);
    const dur = (Math.random()*12 + 12).toFixed(1);
    const delay = (Math.random()*14).toFixed(1);
    const drift = (Math.random()*60 - 30).toFixed(0) + 'px';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = left + '%';
    p.style.setProperty('--drift', drift);
    p.style.animationDuration = dur + 's';
    p.style.animationDelay = delay + 's';
    particlesEl.appendChild(p);
  }

  // ==== تبديل المظهر الداكن / الفاتح ====
  const body = document.body;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  function applyTheme(theme){
    body.setAttribute('data-theme', theme);
    themeIcon.className = theme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
    localStorage.setItem('ayman-theme', theme);
  }
  applyTheme(localStorage.getItem('ayman-theme') || 'dark');
  themeToggle.addEventListener('click', () => {
    applyTheme(body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // ==== الموسيقى ====
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicToggle');
  const musicIcon = document.getElementById('musicIcon');
  const musicIconTop = document.getElementById('musicIconTop');
  const musicLabel = document.getElementById('musicLabel');
  const eq = document.getElementById('eq');
  const MAX_SECONDS = 60;
  let isPlaying = false;

  function setPlayingUI(playing){
    isPlaying = playing;
    musicIcon.className = playing ? 'fa-solid fa-pause' : 'fa-solid fa-play';
    musicIconTop.className = playing ? 'fa-solid fa-volume-high' : 'fa-solid fa-music';
    musicLabel.textContent = playing ? 'جارٍ التشغيل' : 'موسيقى الخلفية';
    eq.classList.toggle('paused', !playing);
  }
  function playMusic(){ audio.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false)); }
  function pauseMusic(){ audio.pause(); setPlayingUI(false); }
  function toggleMusic(){ isPlaying ? pauseMusic() : playMusic(); }

  musicBtn.addEventListener('click', toggleMusic);
  musicIconTop.parentElement.addEventListener('click', toggleMusic);

  audio.addEventListener('timeupdate', () => {
    if (audio.currentTime >= MAX_SECONDS){
      audio.currentTime = 0;
      if (isPlaying) audio.play();
    }
  });

  function tryAutoplayOnFirstInteraction(){
    playMusic();
    document.removeEventListener('click', tryAutoplayOnFirstInteraction);
    document.removeEventListener('touchstart', tryAutoplayOnFirstInteraction);
  }
  document.addEventListener('click', tryAutoplayOnFirstInteraction, { once:true });
  document.addEventListener('touchstart', tryAutoplayOnFirstInteraction, { once:true });
</script>

</body>
</html>
